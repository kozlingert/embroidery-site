<!DOCTYPE html>
<html lang="eng">

<head>

    <meta charset="UTF-8">
    <title>Contact form</title>
    <link rel="stylesheet" href="../styles/stylesheet.css">

</head>
<body>

    <header>
        <h1>Embroidery | Contact</h1>
        <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="galerija.html">Gallery</a></li>
            <li><a href="stitches.html">Get started</a></li>
        </ul>
    </nav>
    </header>


    <form id="contact">


        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name." required>

        <label for="email">E-mail</label>
        <input type="text" id="email" placeholder="Enter your e-mail adress." required>

        <label for="message">Message</label>
        <textarea type="text" id="message" placeholder="Enter your message." rows="5" required></textarea>

        <button type="submit">Send</button>

        <p id="status"></p>
    </form>
    


    <footer>
        <p>Embroidery site, <span id="year"></span></p>
        
    </footer>

    <script src="../scripts/script.js"></script>
 
</body>

</html>
